[package]
name = "ks_sentinel"
version = "0.1.0"
edition = "2021"

[lib]
name = "ks_sentinel"
crate-type = ["rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
pnet_datalink = "0.35"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
thiserror = "1"
